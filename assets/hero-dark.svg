<svg width="960" height="330" viewBox="0 0 960 330" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="60" y1="20" x2="900" y2="315" gradientUnits="userSpaceOnUse">
      <stop stop-color="#12151C"/>
      <stop offset=".58" stop-color="#0F1218"/>
      <stop offset="1" stop-color="#0B0E13"/>
    </linearGradient>

    <radialGradient id="mistBlue">
      <stop offset="0" stop-color="#8A9BFF" stop-opacity=".16"/>
      <stop offset="1" stop-color="#8A9BFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="mistMint">
      <stop offset="0" stop-color="#A9E5CF" stop-opacity=".12"/>
      <stop offset="1" stop-color="#A9E5CF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="mistPeach">
      <stop offset="0" stop-color="#FFB8AA" stop-opacity=".11"/>
      <stop offset="1" stop-color="#FFB8AA" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="streamA" x1="0" y1="0" x2="160" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8A9BFF" stop-opacity="0"/>
      <stop offset=".5" stop-color="#8A9BFF" stop-opacity=".18"/>
      <stop offset="1" stop-color="#8A9BFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="streamB" x1="0" y1="0" x2="170" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#A9E5CF" stop-opacity="0"/>
      <stop offset=".5" stop-color="#A9E5CF" stop-opacity=".16"/>
      <stop offset="1" stop-color="#A9E5CF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="streamC" x1="0" y1="0" x2="140" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFB8AA" stop-opacity="0"/>
      <stop offset=".5" stop-color="#FFB8AA" stop-opacity=".14"/>
      <stop offset="1" stop-color="#FFB8AA" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="streamD" x1="0" y1="0" x2="120" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFD47D" stop-opacity="0"/>
      <stop offset=".5" stop-color="#FFD47D" stop-opacity=".12"/>
      <stop offset="1" stop-color="#FFD47D" stop-opacity="0"/>
    </linearGradient>

    <filter id="blur20" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="20"/>
    </filter>
    <filter id="blur10" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <filter id="glow2" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="2.1"/>
    </filter>
  </defs>

  <style>
    .title {
      font: 600 40px ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      letter-spacing: 2px;
      fill: #F4F1EC;
    }
    .tagline {
      font: 400 18px ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      letter-spacing: .75px;
      fill: #B8BDC6;
    }

    @keyframes mist1 {
      0%,100% { transform: translate(0,0) scale(1); opacity:.48; }
      40% { transform: translate(12px,-8px) scale(1.08); opacity:.65; }
      75% { transform: translate(-8px,4px) scale(.96); opacity:.40; }
    }
    @keyframes mist2 {
      0%,100% { transform: translate(0,0) scale(1); opacity:.42; }
      45% { transform: translate(-10px,7px) scale(1.1); opacity:.58; }
      80% { transform: translate(7px,-5px) scale(.97); opacity:.34; }
    }
    @keyframes twinkle {
      0%,100% { opacity:.28; transform:scale(.92); }
      50% { opacity:.85; transform:scale(1.15); }
    }
    @keyframes breathe {
      0%,100% { opacity:.23; }
      50% { opacity:.85; }
    }

    .m1 { animation:mist1 25s ease-in-out infinite; transform-box: fill-box; transform-origin:center; }
    .m2 { animation:mist2 31s ease-in-out infinite; transform-box: fill-box; transform-origin:center; }
    .tw { animation:twinkle 9.5s ease-in-out infinite; transform-box: fill-box; transform-origin:center; }
    .pulse { animation:breathe 7.5s ease-in-out infinite; }
  </style>

  <rect x="1" y="1" width="958" height="328" rx="26" fill="url(#bg)" stroke="#252B35"/>

  <!-- very soft ambient mist -->
  <ellipse class="m1" cx="248" cy="108" rx="160" ry="72" fill="url(#mistBlue)" filter="url(#blur20)"/>
  <ellipse class="m2" cx="725" cy="219" rx="184" ry="80" fill="url(#mistMint)" filter="url(#blur20)"/>
  <ellipse class="m1" style="animation-duration:35s;animation-direction:reverse" cx="690" cy="92" rx="124" ry="58" fill="url(#mistPeach)" filter="url(#blur20)"/>

  <!-- water-like drifting wisps -->
  <ellipse rx="90" ry="10" fill="url(#streamA)" filter="url(#blur10)" opacity=".9">
    <animateMotion dur="24s" begin="-5s" repeatCount="indefinite"
      path="M-130 112 C96 96 172 86 296 109 S496 154 627 126 S795 78 1090 101"/>
  </ellipse>

  <ellipse rx="105" ry="9" fill="url(#streamB)" filter="url(#blur10)" opacity=".85">
    <animateMotion dur="31s" begin="-19s" repeatCount="indefinite"
      path="M-150 228 C44 249 171 255 300 220 S516 131 642 171 S867 265 1098 235"/>
  </ellipse>

  <ellipse rx="82" ry="8" fill="url(#streamC)" filter="url(#blur10)" opacity=".8">
    <animateMotion dur="27s" begin="-14s" repeatCount="indefinite"
      path="M-120 160 C54 134 159 159 291 186 S523 235 648 196 S863 132 1072 154"/>
  </ellipse>

  <ellipse rx="74" ry="7" fill="url(#streamD)" filter="url(#blur10)" opacity=".75">
    <animateMotion dur="36s" begin="-27s" repeatCount="indefinite"
      path="M-120 79 C62 104 170 115 281 92 S470 45 593 88 S800 146 1088 112"/>
  </ellipse>

  <!-- free-moving particles -->
  <circle r="3.2" fill="#8A9BFF" filter="url(#glow2)">
    <animateMotion dur="28s" begin="-11s" repeatCount="indefinite"
      path="M73 106 C151 58 253 79 328 124 S440 187 529 143 S675 63 757 98 S854 171 917 126"/>
  </circle>

  <circle r="2.4" fill="#A9E5CF">
    <animateMotion dur="34s" begin="-22s" repeatCount="indefinite"
      path="M103 236 C188 281 276 246 345 204 S492 116 565 163 S699 281 784 243 S863 176 919 193"/>
  </circle>

  <circle r="2.1" fill="#FFD47D" opacity=".82">
    <animateMotion dur="42s" begin="-7s" repeatCount="indefinite"
      path="M76 184 C151 146 211 168 278 211 S401 284 483 239 S612 129 683 150 S796 225 907 191"/>
  </circle>

  <circle r="1.9" fill="#FFB8AA" opacity=".78">
    <animateMotion dur="30s" begin="-4s" repeatCount="indefinite"
      path="M142 76 C236 115 283 104 347 67 S468 52 530 97 S634 183 709 143 S798 71 890 92"/>
  </circle>

  <circle r="1.6" fill="#8A9BFF" opacity=".72">
    <animateMotion dur="49s" begin="-30s" repeatCount="indefinite"
      path="M93 289 C181 247 237 271 315 288 S449 303 523 272 S648 204 714 220 S825 291 912 261"/>
  </circle>

  <circle r="1.5" fill="#A9E5CF" opacity=".66">
    <animateMotion dur="45s" begin="-16s" repeatCount="indefinite"
      path="M61 136 C116 194 193 214 264 183 S391 90 462 118 S598 227 670 202 S798 108 907 145"/>
  </circle>

  <circle r="1.4" fill="#FFD47D" opacity=".62">
    <animateMotion dur="40s" begin="-28s" repeatCount="indefinite"
      path="M119 58 C174 99 230 128 303 121 S439 64 513 78 S640 146 723 131 S839 83 900 111"/>
  </circle>

  <circle r="1.7" fill="#FFB8AA" opacity=".58">
    <animateMotion dur="38s" begin="-24s" repeatCount="indefinite"
      path="M78 256 C172 230 224 203 303 154 S470 79 550 114 S689 214 767 209 S869 173 923 138"/>
  </circle>

  <!-- static twinkles -->
  <circle cx="184" cy="91" r="3.8" fill="#8A9BFF" class="tw"/>
  <circle cx="807" cy="104" r="4.1" fill="#A9E5CF" class="tw" style="animation-delay:-4s"/>
  <circle cx="245" cy="269" r="3.6" fill="#FFB8AA" class="tw" style="animation-delay:-7s"/>
  <circle cx="718" cy="264" r="3.5" fill="#FFD47D" class="tw" style="animation-delay:-2s"/>

  <circle cx="158" cy="131" r="1.5" fill="#757D89" class="pulse"/>
  <circle cx="838" cy="73" r="1.4" fill="#757D89" class="pulse" style="animation-delay:-3s"/>
  <circle cx="292" cy="292" r="1.4" fill="#757D89"/>
  <circle cx="675" cy="289" r="1.4" fill="#757D89" class="pulse" style="animation-delay:-5s"/>
  <circle cx="397" cy="71" r="1.3" fill="#757D89" opacity=".52"/>
  <circle cx="571" cy="279" r="1.3" fill="#757D89" opacity=".52"/>

  <text x="480" y="158" text-anchor="middle" class="title">ge-onu</text>
  <text x="480" y="193" text-anchor="middle" class="tagline">a little curious, a little kind.</text>
</svg>